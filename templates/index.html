<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인스타그램 영상 만들기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #fda085 100%);
      min-height: 100vh;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff; border-radius: 24px; padding: 40px;
      width: 100%; max-width: 640px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      transition: max-width .4s ease;
    }
    .card.edit-mode {
      max-width: 1180px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 40px; align-items: start;
    }
    .left-panel  { min-width: 0; }
    .right-panel { min-width: 0; position: sticky; top: 24px; }

    h1 {
      font-size: 1.8rem; font-weight: 800; text-align: center;
      background: linear-gradient(90deg, #f5576c, #fda085);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { text-align: center; color: #888; font-size: .9rem; margin-bottom: 20px; }

    /* ── 포맷 선택 버튼 ── */
    .format-picker {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 28px;
    }
    .fmt-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 14px;
      background: #fff; cursor: pointer; transition: border-color .2s, background .2s;
      min-width: 80px;
    }
    .fmt-btn:hover { border-color: #f5576c; background: #fff0f3; }
    .fmt-btn.active { border-color: #f5576c; background: #fff0f3; }
    .fmt-btn .fmt-icon {
      display: flex; align-items: center; justify-content: center;
      background: #f0f0f0; border-radius: 5px; transition: background .2s;
    }
    .fmt-btn.active .fmt-icon { background: #f5576c; }
    .fmt-btn .fmt-label { font-size: .72rem; font-weight: 700; color: #555; }
    .fmt-btn.active .fmt-label { color: #f5576c; }

    /* ── 업로드 존 ── */
    .drop-zone {
      border: 2.5px dashed #f5576c; border-radius: 16px;
      padding: 40px 20px; text-align: center; cursor: pointer;
      transition: background .2s, border-color .2s; margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover { background: #fff0f3; border-color: #f093fb; }
    .drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
    .drop-zone p { color: #555; font-size: .95rem; }
    .drop-zone span { color: #f5576c; font-weight: 700; }
    #file-input { display: none; }

    /* ── 미리보기 리스트 ── */
    #preview-grid {
      display: flex; flex-direction: column;
      gap: 10px; margin-bottom: 24px;
    }
    /* 카드: 가로 분할 (썸네일 | 컨트롤) */
    .preview-item {
      display: flex; flex-direction: row;
      border-radius: 14px; background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      overflow: visible;
    }

    /* 왼쪽: 썸네일 */
    .preview-img-wrap {
      flex-shrink: 0;
      position: relative;
      width: 90px;
      aspect-ratio: var(--preview-ratio, 9/16);
      background: #000;
      border-radius: 14px 0 0 14px;
      overflow: hidden;
    }
    .preview-img-wrap img,
    .preview-img-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-badge {
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff; font-size: .55rem;
      font-weight: 700; padding: 1px 5px; border-radius: 5px;
      pointer-events: none; white-space: nowrap;
    }
    .order-badge {
      position: absolute; top: 4px; left: 4px;
      background: rgba(0,0,0,.6); color: #fff; font-size: .65rem;
      font-weight: 700; padding: 1px 5px; border-radius: 5px; pointer-events: none;
    }
    .remove-photo-btn {
      position: absolute; top: 4px; right: 4px;
      background: #f5576c; color: #fff; border: none;
      border-radius: 50%; width: 18px; height: 18px;
      font-size: .75rem; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }

    /* 오른쪽: 컨트롤 */
    .preview-controls {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      border-left: 1.5px solid #f0f0f0;
    }

    /* ── 스티커 오버레이 ── */
    .sticker-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    .sticker-node {
      position: absolute; cursor: grab; user-select: none; pointer-events: all;
      display: flex; align-items: center; justify-content: center;
    }
    .sticker-node:hover  { outline: 1.5px dashed rgba(245,87,108,.7); outline-offset: 1px; }
    .sticker-node.active { outline: 2px solid #f5576c; outline-offset: 1px; cursor: grabbing; }
    .sticker-emoji { line-height: 1; pointer-events: none; }
    .sticker-del {
      position: absolute; top: -7px; left: -7px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #f5576c; color: #fff; border: none;
      font-size: .65rem; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      z-index: 20; line-height: 1;
    }
    .sticker-node:hover .sticker-del,
    .sticker-node.active .sticker-del { display: flex; }
    .sticker-resize {
      position: absolute; bottom: -5px; right: -5px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; border: 2px solid #f5576c;
      cursor: se-resize; z-index: 20; display: none;
    }
    .sticker-node:hover .sticker-resize,
    .sticker-node.active .sticker-resize { display: block; }

    /* ── 자막 / 전환 ── */
    .caption-input {
      flex: 1;
      width: 100%; padding: 10px 12px; font-size: .88rem;
      border: none; border-bottom: 1.5px solid #f0f0f0;
      outline: none; background: #fff; color: #333;
      resize: none; font-family: inherit; min-height: 64px;
      border-radius: 0 14px 0 0;
    }
    .caption-input::placeholder { color: #bbb; }
    .caption-input:focus { background: #fff8fa; border-bottom-color: #f5576c; }
    .trans-row {
      display: flex; align-items: center; gap: 0;
      border-bottom: 1.5px solid #f0f0f0;
    }
    .trans-label {
      font-size: .68rem; color: #aaa; padding: 0 8px;
      white-space: nowrap; flex-shrink: 0;
    }
    .trans-select {
      flex: 1; padding: 6px 8px; font-size: .78rem;
      border: none; outline: none; background: #f7f7f7; color: #555;
      cursor: pointer; font-family: inherit;
    }
    .trans-select:focus { background: #fff0f3; }

    /* ── 스티커 팔레트 영역 ── */
    .sticker-area {
      background: #fafafa; padding: 5px 10px;
      border-radius: 0 0 14px 0;
    }
    .sticker-toggle-btn {
      width: 100%; background: none; border: none;
      font-size: .78rem; color: #f5576c; cursor: pointer;
      padding: 3px 0; font-family: inherit; font-weight: 600;
      text-align: left;
    }

    /* 팔레트 패널 */
    .sticker-panel { display: none; margin-top: 5px; }
    .sticker-panel.open { display: block; }

    /* 카테고리 탭 */
    .sticker-tabs {
      display: flex; gap: 2px; margin-bottom: 4px;
      overflow-x: auto; scrollbar-width: none;
    }
    .sticker-tabs::-webkit-scrollbar { display: none; }
    .sticker-tab {
      flex-shrink: 0;
      background: none; border: 1px solid #eee; border-radius: 6px;
      padding: 2px 5px; font-size: .85rem; cursor: pointer; line-height: 1.3;
      transition: background .15s;
    }
    .sticker-tab.active { background: #fff0f3; border-color: #f5576c; }

    /* 이모지 그리드 */
    .sticker-grid {
      display: flex; flex-wrap: wrap; gap: 2px;
      max-height: 84px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #f5576c #f0f0f0;
    }
    .sticker-grid::-webkit-scrollbar { width: 4px; }
    .sticker-grid::-webkit-scrollbar-thumb { background: #f5576c; border-radius: 2px; }
    .sticker-grid button {
      background: none; border: 1px solid #eee; border-radius: 5px;
      font-size: 1rem; padding: 1px 2px; cursor: pointer; line-height: 1.3;
    }
    .sticker-grid button:hover { background: #fff0f3; border-color: #f5576c; }

    /* 직접 입력 */
    .sticker-custom {
      display: flex; gap: 4px; margin-top: 5px;
    }
    .sticker-custom input {
      flex: 1; padding: 3px 6px; font-size: .9rem;
      border: 1.5px solid #ddd; border-radius: 7px; outline: none;
      font-family: inherit;
    }
    .sticker-custom input:focus { border-color: #f5576c; }
    .sticker-custom button {
      background: #f5576c; color: #fff; border: none;
      border-radius: 7px; padding: 3px 9px; cursor: pointer;
      font-size: .78rem; font-weight: 700;
    }

    /* ── 설정 ── */
    .settings { margin-bottom: 24px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .setting-row label { font-size: .9rem; font-weight: 600; color: #333; }
    .setting-row .control { display: flex; align-items: center; gap: 8px; }
    input[type=range] {
      -webkit-appearance: none; width: 150px; height: 6px;
      background: #f5576c; border-radius: 3px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      background: #fff; border: 2.5px solid #f5576c; border-radius: 50%; cursor: pointer;
    }
    #duration-label { font-weight: 700; color: #f5576c; width: 36px; text-align: right; }
    select {
      border: 1.5px solid #ddd; border-radius: 8px; padding: 6px 10px;
      font-size: .9rem; color: #333; background: #fff; outline: none; cursor: pointer;
    }
    select:focus { border-color: #f5576c; }

    /* ── 버튼 ── */
    #create-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(90deg, #f5576c, #fda085);
      color: #fff; font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    #create-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #create-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── 우측 패널 ── */
    .right-panel-inner { background: #f9f9f9; border-radius: 20px; padding: 24px; }
    .right-panel-title { font-size: .85rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 14px; text-align: center; }
    #status { text-align: center; font-size: .9rem; color: #555; min-height: 24px; }
    .progress-bar-wrap { height: 8px; background: #f0f0f0; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #f5576c, #fda085); border-radius: 4px; animation: progress-anim 2s ease-in-out infinite; }
    @keyframes progress-anim { 0%{width:10%} 50%{width:80%} 100%{width:10%} }
    .video-wrap { position: relative; border-radius: 14px; overflow: hidden; background: #000; margin-top: 14px; }
    #preview-video { width: 100%; max-height: 480px; display: block; }
    .video-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      color: #fff; font-size: .9rem; font-weight: 600;
    }
    .video-overlay.show { display: flex; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #change-banner {
      display: none; background: #fff8e1; border: 1.5px solid #fda085;
      border-radius: 10px; padding: 8px 14px; font-size: .82rem;
      color: #c0392b; font-weight: 600; text-align: center; margin-bottom: 14px;
    }
    #download-area { display: none; margin-top: 14px; text-align: center; }
    .dl-btn {
      display: inline-block; padding: 14px 32px; background: #27ae60;
      color: #fff; font-weight: 700; border-radius: 12px;
      text-decoration: none; font-size: 1rem; transition: opacity .2s;
    }
    .dl-btn:hover { opacity: .85; }
    #download-area .hint { color: #888; font-size: .82rem; margin-top: 8px; }
    .error-msg { color: #e74c3c; font-weight: 600; }
    .section-title { font-size: .82rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="card" id="main-card">

  <div class="left-panel" id="left-panel">
    <h1>📸 사진 → 인스타 영상</h1>
    <p class="subtitle">원하는 포맷을 선택하고 사진·영상을 올려보세요</p>

    <!-- 포맷 선택 -->
    <div class="format-picker" id="format-picker">
      <button class="fmt-btn active" data-fmt="portrait">
        <span class="fmt-icon" style="width:28px;height:42px;"></span>
        <span class="fmt-label">세로 9:16</span>
      </button>
      <button class="fmt-btn" data-fmt="landscape">
        <span class="fmt-icon" style="width:48px;height:30px;"></span>
        <span class="fmt-label">가로 16:9</span>
      </button>
      <button class="fmt-btn" data-fmt="square">
        <span class="fmt-icon" style="width:36px;height:36px;"></span>
        <span class="fmt-label">정사각 1:1</span>
      </button>
    </div>

    <div class="drop-zone" id="drop-zone">
      <div class="icon">🖼️</div>
      <p><span>클릭</span>하거나 파일을 여기에 드래그하세요</p>
      <p style="font-size:.8rem;color:#aaa;margin-top:6px;">이미지(JPG·PNG·WEBP) 및 동영상(MP4·MOV·WEBM) · 여러 개 동시 선택 가능</p>
      <input type="file" id="file-input" accept="image/*,video/*" multiple />
    </div>

    <div id="preview-section" style="display:none; margin-bottom:24px;">
      <p class="section-title">사진 순서 및 자막 입력</p>
      <div id="preview-grid"></div>
    </div>

    <div class="settings">
      <div class="setting-row">
        <label>사진당 재생 시간</label>
        <div class="control">
          <input type="range" id="duration-range" min="1" max="10" step="0.5" value="3" />
          <span id="duration-label">3초</span>
        </div>
      </div>
      <div class="setting-row">
        <label>기본 전환 효과</label>
        <div class="control"><select id="transition-select"></select></div>
      </div>
    </div>

    <button id="create-btn" disabled>영상 만들기</button>
  </div>

  <div class="right-panel" id="right-panel" style="display:none;">
    <div class="right-panel-inner">
      <p class="right-panel-title">🎬 미리보기</p>
      <div id="change-banner">⚡ 설정이 변경됐어요 — 2초 후 재생성…</div>
      <div id="status"></div>
      <div class="progress-bar-wrap" id="progress-wrap"><div class="progress-bar"></div></div>
      <div class="video-wrap" id="video-wrap" style="display:none;">
        <video id="preview-video" controls playsinline></video>
        <div class="video-overlay" id="video-overlay">
          <div class="spinner"></div><span>재생성 중…</span>
        </div>
      </div>
      <div id="download-area">
        <a id="download-link" class="dl-btn" href="#" download="instagram_video.mp4">⬇️ 영상 다운로드</a>
        <p class="hint">설정을 바꾸면 자동으로 재생성돼요.</p>
      </div>
    </div>
  </div>

</div>

<script>
/* ─────────────────────────────────────
   이모지 카테고리
───────────────────────────────────── */
const EMOJI_CATS = [
  { tab: '😀', name: '표정', list: [
    '😀','😂','🥰','😍','🤩','😎','🥺','😭','😡','🤔',
    '😴','😊','😋','😏','🤣','😅','🙃','😇','🤗','🫶',
    '😤','😱','😨','🤯','🥳','😤','😬','🤫','🫠','🥸',
  ]},
  { tab: '🐾', name: '동물', list: [
    '🐶','🐱','🐻','🦊','🐼','🐨','🐯','🦁','🐸','🐮',
    '🐷','🐺','🦋','🐝','🦄','🐙','🦈','🐬','🦒','🦓',
    '🐘','🦏','🐆','🦅','🦜','🐧','🦩','🐓','🦔','🐿️',
  ]},
  { tab: '🍕', name: '음식', list: [
    '🍕','🍔','🍟','🌮','🌯','🍜','🍣','🍱','🥗','🍦',
    '🎂','🍩','🍫','🍎','🍓','🥑','🍋','🥤','🧋','🍺',
    '🍷','☕','🧃','🍿','🥞','🥩','🍤','🦞','🥐','🧆',
  ]},
  { tab: '✈️', name: '여행', list: [
    '✈️','🏖️','🏔️','🗺️','🗼','🏝️','🚀','🌍','🏕️','🎡',
    '🚗','🚢','🚁','⛵','🚂','🏟️','🗽','🏰','⛩️','🕌',
    '🌋','🏜️','🌁','🏙️','🌉','🎠','🎢','🎪','🛸','🪂',
  ]},
  { tab: '⚽', name: '스포츠', list: [
    '⚽','🏀','🎾','🏈','⚾','🎯','🏆','🥇','🏅','🎮',
    '🎲','🃏','🎱','🏋️','🤸','⛷️','🏄','🧗','🤺','🏇',
    '🥊','🎽','🎿','🛹','🪃','🏹','🤿','🎣','🧘','🚴',
  ]},
  { tab: '❤️', name: '심볼', list: [
    '❤️','🔥','⭐','✨','💯','💫','💥','💎','🎉','🎊',
    '🌈','🌸','🌙','☀️','⚡','🍀','💰','🔑','📸','🎵',
    '🎶','💡','🏆','👑','🎀','🪄','💌','🔮','🧿','☮️',
  ]},
  { tab: '👍', name: '제스처', list: [
    '👍','👎','👏','🙌','🤝','🤜','✊','✌️','🤞','🤟',
    '🖐️','👋','🤚','👌','🤌','🫰','🫵','💪','🦾','🙏',
    '💅','🫂','👁️','👀','🧠','🦷','🦴','👣','🫀','🫁',
  ]},
];

const DEFAULT_POS = [
  {x:.78, y:.05}, {x:.05, y:.05},
  {x:.78, y:.75}, {x:.05, y:.75},
  {x:.40, y:.05},
];

const TRANSITIONS = [
  {v:'none',       label:'없음 (전환 효과 없이 바로 전환)'},
  {v:'fade',       label:'페이드 (서서히 사라지며 전환)'},
  {v:'fadeblack',  label:'페이드 블랙 (검은 화면으로 전환)'},
  {v:'fadewhite',  label:'페이드 화이트 (흰 화면으로 전환)'},
  {v:'dissolve',   label:'디졸브 (픽셀이 녹아들며 전환)'},
  {v:'wipeleft',   label:'와이프 왼쪽 (오른쪽→왼쪽으로 덮기)'},
  {v:'wiperight',  label:'와이프 오른쪽 (왼쪽→오른쪽으로 덮기)'},
  {v:'wipeup',     label:'와이프 위 (아래→위로 덮기)'},
  {v:'wipedown',   label:'와이프 아래 (위→아래로 덮기)'},
  {v:'slideleft',  label:'슬라이드 왼쪽 (새 장면이 왼쪽에서 밀려옴)'},
  {v:'slideright', label:'슬라이드 오른쪽 (새 장면이 오른쪽에서 밀려옴)'},
  {v:'slideup',    label:'슬라이드 위 (새 장면이 위에서 밀려옴)'},
  {v:'slidedown',  label:'슬라이드 아래 (새 장면이 아래에서 밀려옴)'},
  {v:'smoothleft', label:'스무스 왼쪽 (부드럽게 왼쪽으로 밀림)'},
  {v:'smoothright',label:'스무스 오른쪽 (부드럽게 오른쪽으로 밀림)'},
  {v:'smoothup',   label:'스무스 위 (부드럽게 위로 밀림)'},
  {v:'smoothdown', label:'스무스 아래 (부드럽게 아래로 밀림)'},
  {v:'circlecrop', label:'원형 크롭 (원 모양으로 잘리며 전환)'},
  {v:'rectcrop',   label:'사각 크롭 (사각형으로 잘리며 전환)'},
  {v:'circleopen', label:'원형 열기 (원이 커지며 등장)'},
  {v:'circleclose',label:'원형 닫기 (원이 작아지며 사라짐)'},
  {v:'vertopen',   label:'세로 열기 (가운데서 위아래로 펼쳐짐)'},
  {v:'vertclose',  label:'세로 닫기 (위아래에서 가운데로 닫힘)'},
  {v:'horzopen',   label:'가로 열기 (가운데서 좌우로 펼쳐짐)'},
  {v:'horzclose',  label:'가로 닫기 (좌우에서 가운데로 닫힘)'},
  {v:'radial',     label:'방사형 (시계 방향으로 회전하며 전환)'},
  {v:'distance',   label:'거리 (거리감 있게 중심부터 전환)'},
  {v:'pixelize',   label:'픽셀화 (픽셀이 뭉쳐지며 전환)'},
  {v:'diagtl',     label:'대각선 좌상단 (왼쪽 위 모서리부터 전환)'},
  {v:'diagtr',     label:'대각선 우상단 (오른쪽 위 모서리부터 전환)'},
  {v:'diagbl',     label:'대각선 좌하단 (왼쪽 아래 모서리부터 전환)'},
  {v:'diagbr',     label:'대각선 우하단 (오른쪽 아래 모서리부터 전환)'},
  {v:'hlslice',    label:'가로 슬라이스 (수평선이 잘라지며 전환)'},
  {v:'hrslice',    label:'가로 역슬라이스 (수평선 역방향 전환)'},
  {v:'vuslice',    label:'세로 슬라이스 (수직선이 잘라지며 전환)'},
  {v:'vdslice',    label:'세로 역슬라이스 (수직선 역방향 전환)'},
  {v:'hblur',      label:'수평 블러 (가로 방향으로 흐려지며 전환)'},
];

/* ── 포맷 설정 ── */
const FORMAT_RATIOS = { portrait: '9/16', landscape: '16/9', square: '1/1' };
let selectedFormat = 'portrait';

document.getElementById('format-picker').addEventListener('click', e => {
  const btn = e.target.closest('.fmt-btn');
  if (!btn) return;
  document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedFormat = btn.dataset.fmt;
  document.documentElement.style.setProperty('--preview-ratio', FORMAT_RATIOS[selectedFormat]);
  if (hasGenerated) scheduleRegen();
});

/* ── DOM 참조 ── */
const mainCard       = document.getElementById('main-card');
const rightPanel     = document.getElementById('right-panel');
const dropZone       = document.getElementById('drop-zone');
const fileInput      = document.getElementById('file-input');
const previewGrid    = document.getElementById('preview-grid');
const previewSection = document.getElementById('preview-section');
const createBtn      = document.getElementById('create-btn');
const durationRange  = document.getElementById('duration-range');
const durationLabel  = document.getElementById('duration-label');
const transSelect    = document.getElementById('transition-select');
const statusEl       = document.getElementById('status');
const progressWrap   = document.getElementById('progress-wrap');
const downloadArea   = document.getElementById('download-area');
const downloadLink   = document.getElementById('download-link');
const previewVideo   = document.getElementById('preview-video');
const videoWrap      = document.getElementById('video-wrap');
const videoOverlay   = document.getElementById('video-overlay');
const changeBanner   = document.getElementById('change-banner');

TRANSITIONS.forEach(t => {
  const o = document.createElement('option');
  o.value = t.v; o.textContent = t.label;
  if (t.v === 'fade') o.selected = true;
  transSelect.appendChild(o);
});

/* ── 상태 ── */
let selectedFiles    = [];
let stickersPerPhoto = [];
let hasGenerated     = false;
let debounceTimer    = null;
let isGenerating     = false;

/* ── 드래그/리사이즈 상태 ── */
let interaction = null;

/* ── 스티커 DOM 배치 ── */
function applyToNode(node, s, W, H) {
  const px = s.size * W;
  node.style.width  = px + 'px';
  node.style.height = px + 'px';
  node.style.left   = (s.x * W) + 'px';
  node.style.top    = (s.y * H) + 'px';
  node.querySelector('.sticker-emoji').style.fontSize = (px * 0.82) + 'px';
}

function createStickerNode(s, W, H, photoIdx, stkIdx) {
  const node = document.createElement('div');
  node.className = 'sticker-node';

  const em = document.createElement('span');
  em.className = 'sticker-emoji';
  em.textContent = s.emoji;

  const del = document.createElement('button');
  del.className = 'sticker-del';
  del.textContent = '×';

  const rz = document.createElement('div');
  rz.className = 'sticker-resize';
  rz.title = '크기 조절';

  node.append(em, del, rz);
  applyToNode(node, s, W, H);

  del.addEventListener('mousedown', e => e.stopPropagation());
  del.addEventListener('click', e => {
    e.stopPropagation();
    stickersPerPhoto[photoIdx].splice(stkIdx, 1);
    refreshStickerLayer(node.closest('.preview-item'), photoIdx);
    if (hasGenerated) scheduleRegen();
  });

  const startDrag = (mx, my) => {
    const wrap = node.closest('.preview-img-wrap');
    interaction = { type:'drag', node, photoIdx, stkIdx,
      startMx:mx, startMy:my, origX:s.x, origY:s.y,
      W:wrap.offsetWidth, H:wrap.offsetHeight };
    node.classList.add('active');
  };
  const startResize = (mx) => {
    const wrap = node.closest('.preview-img-wrap');
    interaction = { type:'resize', node, photoIdx, stkIdx,
      startMx:mx, origSize:s.size,
      W:wrap.offsetWidth, H:wrap.offsetHeight };
    node.classList.add('active');
  };

  node.addEventListener('mousedown', e => {
    if (e.target === rz || e.target === del) return;
    e.preventDefault(); startDrag(e.clientX, e.clientY);
  });
  rz.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation(); startResize(e.clientX);
  });
  node.addEventListener('touchstart', e => {
    if (e.target === rz || e.target === del) return;
    e.preventDefault(); startDrag(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  rz.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); startResize(e.touches[0].clientX);
  }, {passive:false});

  return node;
}

function refreshStickerLayer(item, photoIdx) {
  const wrap  = item.querySelector('.preview-img-wrap');
  let layer   = wrap.querySelector('.sticker-layer');
  if (!layer) { layer = document.createElement('div'); layer.className = 'sticker-layer'; wrap.appendChild(layer); }
  layer.innerHTML = '';
  const W = wrap.offsetWidth, H = wrap.offsetHeight;
  (stickersPerPhoto[photoIdx] || []).forEach((s, si) => layer.appendChild(createStickerNode(s, W, H, photoIdx, si)));
}

/* ── 전역 mousemove/up ── */
function handleMove(cx, cy) {
  if (!interaction) return;
  const { type, node, photoIdx, stkIdx, W, H } = interaction;
  const s = stickersPerPhoto[photoIdx][stkIdx];
  if (type === 'drag') {
    const dx = cx - interaction.startMx, dy = cy - interaction.startMy;
    s.x = Math.max(0, Math.min(1 - s.size,           interaction.origX + dx / W));
    s.y = Math.max(0, Math.min(1 - s.size * (W / H),  interaction.origY + dy / H));
  } else {
    const dx = cx - interaction.startMx;
    s.size = Math.max(0.06, Math.min(0.55, interaction.origSize + dx / W));
    s.x = Math.min(s.x, 1 - s.size);
    s.y = Math.min(s.y, 1 - s.size * (W / H));
  }
  applyToNode(node, s, W, H);
}
function handleEnd() {
  if (!interaction) return;
  interaction.node.classList.remove('active');
  interaction = null;
  if (hasGenerated) scheduleRegen();
}
document.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
document.addEventListener('mouseup', handleEnd);
document.addEventListener('touchmove', e => { if (!interaction) return; e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
document.addEventListener('touchend', handleEnd);

/* ── 스티커 추가 헬퍼 ── */
function addStickerToPhoto(emoji, photoIdx, item) {
  const existing = stickersPerPhoto[photoIdx];
  const pos = DEFAULT_POS[existing.length % DEFAULT_POS.length];
  existing.push({ emoji, x: pos.x, y: pos.y, size: 0.15 });
  const media = item.querySelector('img') || item.querySelector('video');
  const ready = media.tagName === 'VIDEO' ? media.readyState >= 1 : media.complete;
  if (ready) refreshStickerLayer(item, photoIdx);
  else media.addEventListener(media.tagName === 'VIDEO' ? 'loadedmetadata' : 'load',
    () => refreshStickerLayer(item, photoIdx), { once: true });
  if (hasGenerated) scheduleRegen();
}

/* ── 팔레트 HTML 생성 ── */
function buildPaletteHTML() {
  const tabs = EMOJI_CATS.map((c, i) =>
    `<button class="sticker-tab${i===0?' active':''}" data-cat="${i}" title="${c.name}">${c.tab}</button>`
  ).join('');
  const grid = EMOJI_CATS[0].list.map(e => `<button>${e}</button>`).join('');
  return `
    <div class="sticker-tabs">${tabs}</div>
    <div class="sticker-grid">${grid}</div>
    <div class="sticker-custom">
      <input type="text" placeholder="이모지 직접 입력…" maxlength="8" />
      <button>추가</button>
    </div>
  `;
}

/* ── 파일 관리 ── */
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(Array.from(e.dataTransfer.files)); });
fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

const ACCEPTED = f => f.type.startsWith('image/') || f.type.startsWith('video/');

function addFiles(files) {
  const valid = files.filter(ACCEPTED);
  selectedFiles = [...selectedFiles, ...valid];
  valid.forEach(() => stickersPerPhoto.push([]));
  renderPreviews();
}
function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  stickersPerPhoto.splice(idx, 1);
  renderPreviews();
  if (hasGenerated) scheduleRegen();
}

/* ── 미리보기 렌더링 ── */
function renderPreviews() {
  previewGrid.innerHTML = '';
  selectedFiles.forEach((file, i) => {
    const url     = URL.createObjectURL(file);
    const isVid   = file.type.startsWith('video/');
    const item    = document.createElement('div');
    item.className = 'preview-item';
    const dt = transSelect.value;

    const mediaTpl = isVid
      ? `<video src="${url}" muted playsinline preload="metadata"></video>
         <span class="video-badge">🎬 동영상</span>`
      : `<img src="${url}" alt="photo ${i+1}" />`;

    item.innerHTML = `
      <div class="preview-img-wrap">
        ${mediaTpl}
        <span class="order-badge">${i+1}</span>
        <button class="remove-photo-btn" title="삭제">×</button>
        <div class="sticker-layer"></div>
      </div>
      <div class="preview-controls">
        <textarea class="caption-input" placeholder="자막을 입력하세요 (선택사항)"></textarea>
        <div class="trans-row">
          <span class="trans-label">↓ 전환</span>
          <select class="trans-select">
            ${TRANSITIONS.map(t=>`<option value="${t.v}"${t.v===dt?' selected':''}>${t.label}</option>`).join('')}
          </select>
        </div>
        <div class="sticker-area">
          <button class="sticker-toggle-btn">🎨 스티커 추가</button>
          <div class="sticker-panel">${buildPaletteHTML()}</div>
        </div>
      </div>
    `;

    item.querySelector('.remove-photo-btn').addEventListener('click', () => removeFile(i));
    item.querySelector('.caption-input').addEventListener('input', () => { if (hasGenerated) scheduleRegen(); });
    item.querySelector('.trans-select').addEventListener('change', () => { if (hasGenerated) scheduleRegen(); });

    // 팔레트 토글
    const toggleBtn = item.querySelector('.sticker-toggle-btn');
    const panel     = item.querySelector('.sticker-panel');
    toggleBtn.addEventListener('click', () => panel.classList.toggle('open'));

    // 카테고리 탭
    const tabsEl = panel.querySelector('.sticker-tabs');
    const gridEl = panel.querySelector('.sticker-grid');
    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.sticker-tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.sticker-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const cat = EMOJI_CATS[+tab.dataset.cat];
      gridEl.innerHTML = cat.list.map(e => `<button>${e}</button>`).join('');
    });

    // 그리드 클릭 (이벤트 위임)
    gridEl.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) addStickerToPhoto(btn.textContent, i, item);
    });

    // 직접 입력
    const customInput = panel.querySelector('.sticker-custom input');
    const customBtn   = panel.querySelector('.sticker-custom button');
    const doCustomAdd = () => {
      const val = customInput.value.trim();
      if (!val) return;
      // 첫 번째 이모지/문자만 추출
      const seg = [...new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(val)];
      if (seg.length) { addStickerToPhoto(seg[0].segment, i, item); customInput.value = ''; }
    };
    customBtn.addEventListener('click', doCustomAdd);
    customInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doCustomAdd(); } });

    // 미디어 로드 후 스티커 레이어
    if (isVid) {
      const vid = item.querySelector('video');
      vid.addEventListener('loadedmetadata', () => refreshStickerLayer(item, i));
      if (vid.readyState >= 1) refreshStickerLayer(item, i);
    } else {
      const img = item.querySelector('img');
      img.addEventListener('load', () => refreshStickerLayer(item, i));
      if (img.complete) refreshStickerLayer(item, i);
    }

    previewGrid.appendChild(item);
  });

  const hasFiles = selectedFiles.length > 0;
  previewSection.style.display = hasFiles ? 'block' : 'none';
  createBtn.disabled = !hasFiles;
  if (!hasGenerated) {
    const imgCnt = selectedFiles.filter(f => f.type.startsWith('image/')).length;
    const vidCnt = selectedFiles.length - imgCnt;
    statusEl.textContent = hasFiles
      ? [imgCnt && `사진 ${imgCnt}장`, vidCnt && `동영상 ${vidCnt}개`].filter(Boolean).join(' · ') + ' 선택됨'
      : '';
    statusEl.className = '';
  }
}

/* ── 설정 변경 ── */
durationRange.addEventListener('input', () => {
  durationLabel.textContent = durationRange.value + '초';
  if (hasGenerated) scheduleRegen();
});
transSelect.addEventListener('change', () => {
  previewGrid.querySelectorAll('.trans-select').forEach(s => s.value = transSelect.value);
  if (hasGenerated) scheduleRegen();
});

function scheduleRegen() {
  changeBanner.style.display = 'block';
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => generateVideo(true), 2000);
}

function collectFormData() {
  const captions    = Array.from(previewGrid.querySelectorAll('.caption-input')).map(el => el.value.trim());
  const transitions = Array.from(previewGrid.querySelectorAll('.trans-select')).map(el => el.value);
  const fd = new FormData();
  selectedFiles.forEach(f => fd.append('photos', f));
  fd.append('duration',    durationRange.value);
  fd.append('captions',    JSON.stringify(captions));
  fd.append('transitions', JSON.stringify(transitions));
  fd.append('stickers',    JSON.stringify(stickersPerPhoto));
  fd.append('format',      selectedFormat);
  return fd;
}

async function generateVideo(isRegen = false) {
  if (selectedFiles.length === 0 || isGenerating) return;
  isGenerating = true;
  createBtn.disabled = true;
  changeBanner.style.display = 'none';

  if (!isRegen) {
    rightPanel.style.display = 'block';
    mainCard.classList.add('edit-mode');
    statusEl.textContent = '영상을 만드는 중입니다…';
    statusEl.className = '';
    progressWrap.style.display = 'block';
    downloadArea.style.display = 'none';
    videoWrap.style.display = 'none';
  } else {
    videoOverlay.classList.add('show');
    progressWrap.style.display = 'block';
  }

  try {
    const res  = await fetch('/create', { method:'POST', body: collectFormData() });
    const data = await res.json();
    if (!res.ok || data.error) {
      statusEl.textContent = '오류: ' + (data.error || '알 수 없는 오류');
      statusEl.className = 'error-msg';
    } else {
      hasGenerated = true;
      statusEl.textContent = isRegen ? '✅ 재생성 완료!' : '✅ 완료! 설정을 바꾸면 자동으로 다시 만들어드려요.';
      statusEl.className = '';
      const vid = data.video_id;
      previewVideo.src = '/preview/' + vid + '?t=' + Date.now();
      previewVideo.load();
      previewVideo.play().catch(() => {});
      downloadLink.href = '/download/' + vid;
      videoWrap.style.display = 'block';
      downloadArea.style.display = 'block';
      createBtn.textContent = '다시 만들기';
    }
  } catch {
    statusEl.textContent = '네트워크 오류가 발생했습니다.';
    statusEl.className = 'error-msg';
  } finally {
    progressWrap.style.display = 'none';
    videoOverlay.classList.remove('show');
    createBtn.disabled = selectedFiles.length === 0;
    isGenerating = false;
  }
}

createBtn.addEventListener('click', () => {
  clearTimeout(debounceTimer);
  generateVideo(hasGenerated);
});
</script>
